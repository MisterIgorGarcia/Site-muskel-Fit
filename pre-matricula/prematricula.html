<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pré-Matrícula — Muskel Fit</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<header id="cabecalho">
        <h1><span class="spanm">M</span>USKEL <span class="spanfit">FIT</span></h1>
</header>

<section class="secao">
    <h2>Pré-Matrícula</h2>
    <p class="subtitulo-horario">
        Preencha seus dados, escolha o plano e finalize pelo WhatsApp.
    </p>

    <form id="form-matricula" class="form-matricula" novalidate>

        <div class="campo">
            <label for="nome">Nome completo *</label>
            <input type="text" id="nome" name="nome" required autocomplete="name">
        </div>

        <div class="campo">
            <label for="nascimento">Data de nascimento *</label>
            <input type="date" id="nascimento" name="nascimento" required>
        </div>

        <div class="campo">
            <label for="telefone">Telefone fixo</label>
            <input type="tel" id="telefone" name="telefone"
                   placeholder="(12) 3000-0000" autocomplete="tel">
        </div>

        <div class="campo">
            <label for="celular">Celular (WhatsApp) *</label>
            <input type="tel" id="celular" name="celular"
                   placeholder="(12) 99999-9999" required autocomplete="tel">
        </div>

        <!-- Unidade vem ANTES de plano/modalidade -->
        <div class="campo">
            <label for="unidade">Unidade *</label>
            <select id="unidade" name="unidade" required>
                <option value="">Carregando unidades...</option>
            </select>
        </div>

        <div class="campo">
            <label for="modalidade">Modalidade *</label>
            <select id="modalidade" name="modalidade" required disabled>
                <option value="">Selecione a unidade primeiro...</option>
            </select>
        </div>

        <div class="campo">
            <label for="plano">Plano desejado *</label>
            <select id="plano" name="plano" required disabled>
                <option value="">Selecione a unidade primeiro...</option>
            </select>
        </div>

        <fieldset class="campo campo-radio">
            <legend>Forma de pagamento *</legend>
            <label>
                <input type="radio" name="pagamento" value="PIX" required>
                <i class="fa-brands fa-pix"></i> PIX
            </label>
            <label>
                <input type="radio" name="pagamento" value="Débito">
                <i class="fa-solid fa-credit-card"></i> Débito
            </label>
            <label>
                <input type="radio" name="pagamento" value="Crédito">
                <i class="fa-solid fa-credit-card"></i> Crédito
            </label>
        </fieldset>

        <button type="submit" class="btn-amarelo">
            <i class="fa-solid fa-lock"></i> Ir para o pagamento
        </button>
    </form>

    <div id="painel-confirmacao" class="painel-pagamento" hidden>
        <h3><i class="fa-solid fa-circle-check"></i> Pagamento aprovado!</h3>
        <p>Seus dados estão prontos. Clique abaixo para enviar ao WhatsApp:</p>
        <button type="button" id="btn-enviar-whatsapp" class="btn-amarelo">
            <i class="fa-brands fa-whatsapp"></i> Enviar no WhatsApp
        </button>
        <p class="aviso-pix">
            A academia vai confirmar sua matrícula após verificar o pagamento.
        </p>
    </div>

</section>

<script src="../script/prematricula.js"></script>
</body>
</html>
