<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Recepção — Muskel Fit</title>
    <link rel="stylesheet" href="../estilos/style.css">
    <link rel="stylesheet" href="../estilos/styleadmin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- BIBLIOTECA DO CHARTS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- BIBLIOTECA PARA GERAR EXCELL -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- TRAVA DE SEGURANÇA -->
    <script>
        if (sessionStorage.getItem('adminLogado') !== 'sim' || sessionStorage.getItem('adminCargo') !== 'funcionario') {
            window.location.href = 'admin.html'; 
        }
    </script>
</head>
<body class="admin-body">

    <div id="painel-admin">
        <!-- CABEÇALHO CORRIGIDO -->
        <header id="cabecalho" style="margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px;">
                <h1><span class="spanm">M</span>USKEL <span class="spanfit">FIT</span> - FUNCIONÁRIO</h1>
                
                <!-- Badge do Funcionário -->
                <div class="badge-usuario-header">
                    <i class="fa-solid fa-circle-user"></i>
                    <span>Olá, <strong id="nome-usuario-logado">...</strong></span>
                </div>

                <!-- Badge da Unidade -->
                <div class="badge-unidade-header" id="header-unidade">
                    <i class="fa-solid fa-location-dot"></i>
                    <span id="texto-unidade-badge">Carregando...</span>
                </div>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button onclick="mudarPropriaSenha()" class="btn-voltar-header" style="border-color: var(--cor-secundaria); color: var(--cor-secundaria);">
                    <i class="fa-solid fa-key"></i> Mudar Senha
                </button>
                <button id="btn-sair" class="btn-voltar-header" onclick="sessionStorage.clear(); window.location.href='admin.html'">Sair <i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <main class="admin-container">
            <div class="admin-header-titulo">
                <h2>Lista de Alunos</h2>
                <div style="display: flex; gap: 10px;">
                    <!-- Botão Excel com Tabler Icons -->
                    <button onclick="exportarExcel()" class="btn-export" style="background-color: #22c55e; color: #fff;">
                        <i class="ti ti-file-type-xls"></i> Exportar Excel
                    </button>

                    <!-- Botão CSV com Tabler Icons -->
                    <button onclick="exportarCSV()" class="btn-export" style="background-color: #3b82f6; color: #fff;">
                        <i class="ti ti-file-type-csv"></i> Exportar CSV
                    </button>

                    <button id="btn-atualizar" class="btn-amarelo" onclick="carregarDados(true)">
                        <i class="fa-solid fa-rotate-right"></i> Atualizar Dados
                    </button>
                </div>
            </div>

            <!-- GRÁFICO COM FILTROS E ABAS -->
            <div class="admin-card" style="flex-direction: column; align-items: stretch; margin-bottom: 40px; background-color: #141414;">
                
                <!-- Cabeçalho e Abas -->
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;">
                    <h3 style="color: var(--cor-secundaria); font-size: 1.2rem; margin: 0;">
                        <i class="fa-solid fa-chart-pie"></i> Análise de Dados
                    </h3>
                    
                    <div class="abas-container">
                        <button id="btn-aba-composicao" class="aba-btn ativa" onclick="mudarAba('composicao')">Composição</button>
                        <button id="btn-aba-historico" class="aba-btn" onclick="mudarAba('historico')">Histórico</button>
                    </div>
                </div>

                <!-- Filtros -->
                <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;">
                    <select id="filtro-origem" class="admin-select" onchange="atualizarGraficos()">
                        <option value="todos">Visão Geral (Tudo)</option>
                        <option value="matriculas">Somente Mensalidades</option>
                        <option value="prematriculas">Somente Pré-Matrículas</option>
                    </select>

                    <select id="filtro-agrupamento" class="admin-select" onchange="atualizarGraficos()">
                        <option value="plano">Agrupar por Plano</option>
                        <option value="unidade">Agrupar por Unidade</option>
                        <option value="modalidade">Agrupar por Modalidade</option>
                        <option value="pagamento">Agrupar por Pagamento</option>
                    </select>
                </div>

                <!-- Área do Gráfico de Composição (Pizza) -->
                <div id="div-grafico-composicao" style="position: relative; height: 350px; width: 100%; display: flex; justify-content: center;">
                    <canvas id="grafico-unico"></canvas>
                </div>
                
                <!-- Área do Gráfico de Histórico (Linha) -->
                <div id="div-grafico-historico" style="position: relative; height: 350px; width: 100%; display: none; justify-content: center;">
                    <canvas id="grafico-historico"></canvas>
                </div>
            </div>

            <div class="admin-cards">
                <div class="admin-card">
                    <i class="fa-solid fa-users"></i>
                    <div>
                        <h3 id="total-registros">0</h3>
                        <p>Total de Registros</p>
                    </div>
                </div>
            </div>

            <div class="admin-tabelas">
                <h3>Últimas Mensalidades</h3>
                <div class="tabela-responsiva">
                    <table class="tabela-admin">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Nome</th>
                                <th>Celular</th>
                                <th>Unidade</th>
                                <th>Modalidade</th>
                                <th>Plano</th>
                                <th>Pagamento</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-matriculas-body"></tbody>
                    </table>
                </div>
                <div id="paginacao-matriculas" class="paginacao-container"></div>

                <h3 style="margin-top: 40px;">Últimas Pré-Matrículas</h3>
                <div class="tabela-responsiva">
                    <table class="tabela-admin">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Nome</th>
                                <th>Celular</th>
                                <th>Unidade</th>
                                <th>Modalidade</th>
                                <th>Plano</th>
                                <th>Pagamento</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-prematriculas-body"></tbody>
                    </table>
                </div>
                <div id="paginacao-prematriculas" class="paginacao-container"></div>
            </div>
        </main>
    </div>

    <script src="../script/admin-dashboard.js"></script>
    <script src="../script/export-excel.js"></script>
    <script src="../script/export-csv.js"></script>
</body>
</html>
