<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Recepção — Muskel Fit</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- BIBLIOTECA PARA GERAR EXCELL -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- TRAVA DE SEGURANÇA -->
    <script>
        if (sessionStorage.getItem('adminLogado') !== 'sim' || sessionStorage.getItem('adminCargo') !== 'funcionario') {
            window.location.href = 'admin.html'; // Chuta de volta pro login se não for funcionário
        }
    </script>
</head>
<body class="admin-body">

    <div id="painel-admin">
        <header id="cabecalho" style="margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center;">
            <h1><span class="spanm">M</span>USKEL <span class="spanfit">FIT</span> - FUNCIONÁRIO <span id="header-unidade" style="font-size: 0.6em; color: var(--cor-secundaria); margin-left: 10px;"></span></h1>
                 <!-- Badge do Funcionário -->
                <div class="badge-usuario-header">
                    <i class="fa-solid fa-circle-user"></i>
                    <span>Olá, <strong id="nome-usuario-logado">Carregando...</strong></span>
                </div>

                <!-- Badge da Unidade -->
                <div class="badge-unidade-header" id="header-unidade">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>Carregando...</span>
                </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="mudarPropriaSenha()" class="btn-voltar-header" style="border-color: var(--cor-secundaria); color: var(--cor-secundaria);">
                    <i class="fa-solid fa-key"></i> Mudar Senha
                </button>
                <button id="btn-sair" class="btn-voltar-header" onclick="sessionStorage.clear(); window.location.href='admin.html'">Sair <i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <main class="admin-container">
            <div class="admin-header-titulo">
                <h2>Lista de Alunos</h2>
                <div style="display: flex; gap: 10px;">
                    <button onclick="exportarExcel()" class="btn-amarelo" style="background-color: #22c55e; color: #fff;">
                        <i class="fa-solid fa-file-excel"></i> Exportar Excel
                    </button>
                    <button id="btn-atualizar" class="btn-amarelo" onclick="carregarDados()">
                        <i class="fa-solid fa-rotate-right"></i> Atualizar Dados
                    </button>
                </div>
            </div>

            <!-- Apenas o card de total de alunos fica visível para funcionários -->
            <div class="admin-cards">
                <div class="admin-card">
                    <i class="fa-solid fa-users"></i>
                    <div>
                        <h3 id="total-registros">0</h3>
                        <p>Total de Alunos</p>
                    </div>
                </div>
            </div>

            <div class="admin-tabelas">
                <h3>Últimas Matrículas</h3>
                <div class="tabela-responsiva">
                    <table class="tabela-admin">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Nome</th>
                                <th>Celular</th>
                                <th>Unidade</th>
                                <th>Modalidade</th>
                                <th>Plano</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-matriculas-body"></tbody>
                    </table>
                </div>

                <h3 style="margin-top: 40px;">Últimas Pré-Matrículas</h3>
                <div class="tabela-responsiva">
                    <table class="tabela-admin">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Nome</th>
                                <th>Celular</th>
                                <th>Unidade</th>
                                <th>Modalidade</th>
                                <th>Plano</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-prematriculas-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../script/admin-dashboard.js"></script>
</body>
</html>
