<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Dono — Muskel Fit</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- TRAVA DE SEGURANÇA -->
    <script>
        if (sessionStorage.getItem('adminLogado') !== 'sim' || sessionStorage.getItem('adminCargo') !== 'dono') {
            window.location.href = 'admin.html'; // Chuta de volta pro login se não for o dono
        }
    </script>
</head>

<body class="admin-body">
    <div id="painel-admin">
        <header id="cabecalho" style="margin-bottom: 30px;">
            <h1><span class="spanm">M</span>USKEL <span class="spanfit">FIT</span> - DONO</h1>
            <button id="btn-sair" class="btn-voltar-header" onclick="sessionStorage.clear(); window.location.href='admin.html'">Sair <i class="fa-solid fa-right-from-bracket"></i></button>
        </header>

        <main class="admin-container">
            <div class="admin-header-titulo">
                <h2>Visão Geral da Academia</h2>
                <button id="btn-atualizar" class="btn-amarelo" onclick="carregarDados()"><i class="fa-solid fa-rotate-right"></i> Atualizar Dados</button>
            </div>

            <div class="admin-cards">
                <div class="admin-card">
                    <i class="fa-solid fa-users"></i>
                    <div>
                        <h3 id="total-registros">0</h3>
                        <p>Total de Alunos</p>
                    </div>
                </div>
                <div class="admin-card">
                    <i class="fa-solid fa-money-bill-wave"></i>
                    <div>
                        <h3 id="total-arrecadado">R$ 0,00</h3>
                        <p>Valor Total (Potencial)</p>
                    </div>
                </div>
            </div>

            <div class="admin-tabelas">
                <h3>Últimas Matrículas</h3>
                <div class="tabela-responsiva">
                    <table class="tabela-admin">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Nome</th>
                                <th>Celular</th>
                                <th>Unidade</th>
                                <th>Plano</th>
                                <th>Valor</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-matriculas-body"></tbody>
                    </table>
                </div>

                <h3 style="margin-top: 40px;">Últimas Pré-Matrículas</h3>
                <div class="tabela-responsiva">
                    <table class="tabela-admin">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Nome</th>
                                <th>Celular</th>
                                <th>Unidade</th>
                                <th>Plano</th>
                                <th>Valor</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-prematriculas-body"></tbody>
                    </table>
                </div>
            </div>
            <!-- ===================== GERENCIAR FUNCIONÁRIOS ===================== -->
            <div style="margin-top: 50px; padding-top: 30px; border-top: 1px solid #333;">
                <h3><i class="fa-solid fa-users-gear"></i> Gerenciar Acessos da Equipe</h3>
                
                <!-- Formulário de Adição -->
                <div class="admin-card" style="margin-top: 15px; align-items: flex-end; gap: 15px; flex-wrap: wrap; background-color: #141414; border-left-color: #3b82f6;">
                    <div style="flex: 1; min-width: 150px;">
                        <label style="color: #999; font-size: 0.85rem; margin-bottom: 5px; display: block;">Novo Usuário</label>
                        <input type="text" id="novo-user" placeholder="Ex: joao.silva" style="width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #333; background: #0d0d0d; color: #fff; outline: none;">
                    </div>
                    <div style="flex: 1; min-width: 150px;">
                        <label style="color: #999; font-size: 0.85rem; margin-bottom: 5px; display: block;">Senha de Acesso</label>
                        <input type="text" id="nova-senha" placeholder="Ex: senha123" style="width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #333; background: #0d0d0d; color: #fff; outline: none;">
                    </div>
                    <button onclick="adicionarFuncionario()" class="btn-amarelo" style="padding: 12px 20px; height: 43px;">
                        <i class="fa-solid fa-plus"></i> Adicionar
                    </button>
                </div>

                <!-- Tabela de Funcionários -->
                <div class="tabela-responsiva" style="margin-top: 20px;">
                    <table class="tabela-admin">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Usuário</th>
                                <th>Cargo</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-usuarios-body">
                            <!-- O JavaScript vai injetar os funcionários aqui -->
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- ===================== FIM GERENCIAR FUNCIONÁRIOS ===================== -->
        </main>
    </div>

    <script src="../script/admin-dashboard.js"></script>
</body>

</html>
